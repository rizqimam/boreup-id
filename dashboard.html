<!DOCTYPE html>

  <title>Dashboard - BoreUp.ID</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard">

  <header>
    <h1>Dashboard BoreUp.ID</h1>

  <div class="kalkulator-grid" id="kalkulatorList"></div>

  <!-- Kontainer dinamis kalkulator -->

  <script src="script.js"></script>

</html>
